<script>
  if ("serviceWorker" in navigator) {
    const sendGymWorkerMessage = (message) => {
      navigator.serviceWorker.ready
        .then(registration => {
          const worker =
            registration.active ||
            navigator.serviceWorker.controller;

          if (worker) {
            worker.postMessage(message);
          }
        })
        .catch(error => {
          console.error(
            "Service worker není připravený:",
            error
          );
        });
    };

    const showGymOfflineMessage = (message) => {
      let box = document.getElementById("gym-offline-status");

      if (!box) {
        box = document.createElement("div");
        box.id = "gym-offline-status";
        box.style.cssText =
          "position:fixed;left:12px;right:12px;bottom:14px;z-index:10000;" +
          "padding:12px 16px;border-radius:12px;background:#dcfce7;" +
          "color:#166534;border:1px solid #86efac;" +
          "font:600 14px Arial,sans-serif;text-align:center;" +
          "box-shadow:0 4px 16px rgba(0,0,0,.12);";
        document.body.appendChild(box);
      }

      box.textContent = message;

      clearTimeout(window.gymOfflineMessageTimer);
      window.gymOfflineMessageTimer = setTimeout(() => {
        box.remove();
      }, 5000);
    };

    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js")
        .then(() => {
          {% if current_user.is_authenticated %}
            sendGymWorkerMessage({
              type: "SET_USER_CONTEXT",
              userId: {{ current_user.id | tojson }},
              prepareOffline: false
            });
          {% else %}
            sendGymWorkerMessage({
              type: "CLEAR_USER_CONTEXT"
            });
          {% endif %}
        })
        .catch(error => {
          console.error(
            "Service worker se nepodařilo zaregistrovat:",
            error
          );
        });
    });

    navigator.serviceWorker.addEventListener("message", event => {
      const message = event.data || {};

      if (message.type === "OFFLINE_REQUEST_QUEUED") {
        if (message.action === "delete") {
          showGymOfflineMessage(
            "Smazání je uložené offline. Provede se automaticky po připojení."
          );
        } else if (message.action === "edit") {
          showGymOfflineMessage(
            "Úprava je uložená offline. Provede se automaticky po připojení."
          );
        } else {
          showGymOfflineMessage(
            "Záznam je uložený offline. Provede se automaticky po připojení."
          );
        }
      }

      if (message.type === "OFFLINE_SYNC_COMPLETE") {
        showGymOfflineMessage(
          `Synchronizace dokončena (${message.count} změn).`
        );

        // Reload so the page displays the server state after sync.
        setTimeout(() => window.location.reload(), 700);
      }
    });

    window.addEventListener("online", () => {
      sendGymWorkerMessage({
        type: "SYNC_OFFLINE_DATA"
      });
    });
  }
</script>
