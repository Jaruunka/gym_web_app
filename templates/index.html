<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
        }

        .container {
            width: 100%;
            max-width: 550px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 18px;
            text-align: center;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 2rem;
        }

        a.button {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 85px;
            padding: 15px;
            box-sizing: border-box;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        a.button:hover {
            background-color: #45a049;
        }

        a.button:active {
            transform: scale(0.98);
        }

        a.logout {
            background-color: #f44336;
        }

        a.logout:hover {
            background-color: #da2e1a;
        }

        .connection-status {
            display: none;
            margin: 0;
            padding: 10px 12px;
            border-radius: 10px;
            background-color: #fff3cd;
            color: #664d03;
            font-size: 0.95rem;
        }

        .connection-status.visible {
            display: block;
        }

        .connection-status.success {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        @media (max-width: 600px) {
            .container {
                max-width: none;
                padding: 16px;
            }

            h1 {
                font-size: 1.7rem;
            }

            a.button {
                min-height: 95px;
                font-size: 1.35rem;
            }
        }
    </style>

    {% include '_pwa_head.html' %}
</head>

<body>
    <div class="container">
        <h1>Vítej na Gym Web App</h1>

        <p id="connection-status" class="connection-status" role="status" aria-live="polite"></p>

        {% if current_user.is_authenticated %}
            <p>Jsi přihlášen(a) jako {{ current_user.email }}.</p>

            <a href="{{ url_for('zadat') }}" class="button">
                Zadat nový trénink
            </a>

            <a href="{{ url_for('historie') }}" class="button">
                Historie tréninků
            </a>

            <a href="{{ url_for('logout') }}" class="button logout">
                Odhlásit se
            </a>
        {% else %}
            <a href="{{ url_for('login') }}" class="button">
                Přihlásit se
            </a>

            <a href="{{ url_for('register') }}" class="button">
                Registrovat
            </a>
        {% endif %}
    </div>

    {% include '_pwa_scripts.html' %}

    <script>
        (() => {
            const statusElement = document.getElementById('connection-status');
            let hideStatusTimer = null;

            function showStatus(message, success = false, temporary = false) {
                window.clearTimeout(hideStatusTimer);
                statusElement.textContent = message;
                statusElement.classList.add('visible');
                statusElement.classList.toggle('success', success);

                if (temporary) {
                    hideStatusTimer = window.setTimeout(() => {
                        if (navigator.onLine) {
                            statusElement.classList.remove('visible', 'success');
                        }
                    }, 4500);
                }
            }

            function sendToServiceWorker(message) {
                if (!('serviceWorker' in navigator)) {
                    return;
                }

                navigator.serviceWorker.ready.then(registration => {
                    const worker = registration.active || navigator.serviceWorker.controller;
                    if (worker) {
                        worker.postMessage(message);
                    }
                });
            }

            function updateConnectionStatus() {
                if (navigator.onLine) {
                    sendToServiceWorker({ type: 'SYNC_OFFLINE_DATA' });
                    statusElement.classList.remove('visible', 'success');
                } else {
                    showStatus('Jsi offline. Nové záznamy se odešlou po připojení.');
                }
            }

            {% if current_user.is_authenticated %}
                sendToServiceWorker({
                    type: 'SET_USER_CONTEXT',
                    userId: {{ current_user.id | tojson }}
                });
            {% else %}
                sendToServiceWorker({ type: 'CLEAR_USER_CONTEXT' });
            {% endif %}

            window.addEventListener('online', updateConnectionStatus);
            window.addEventListener('offline', updateConnectionStatus);

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.addEventListener('message', event => {
                    const message = event.data || {};

                    if (message.type === 'OFFLINE_REQUEST_QUEUED') {
                        const queuedText = message.action === 'delete'
                            ? 'Smazání je uložené a čeká na připojení.'
                            : message.action === 'edit'
                                ? 'Úprava je uložená a čeká na připojení.'
                                : 'Záznam je uložený offline a čeká na odeslání.';
                        showStatus(queuedText);
                    }

                    if (message.type === 'OFFLINE_SYNC_COMPLETE') {
                        const count = Number(message.count) || 0;
                        showStatus(
                            count === 1
                                ? 'Offline záznam byl synchronizován.'
                                : `Synchronizováno offline záznamů: ${count}.`,
                            true,
                            true
                        );
                    }

                    if (message.type === 'OFFLINE_SYNC_ERROR') {
                        showStatus(
                            'Jednu offline změnu se nepodařilo odeslat. Zůstává bezpečně uložená pro další pokus.'
                        );
                    }

                    if (message.type === 'OFFLINE_CACHE_START') {
                        showStatus(
                            'Připravuji nouzový offline zápis…'
                        );
                    }

                    if (
                        message.type === 'OFFLINE_CACHE_READY' &&
                        !message.unchanged
                    ) {
                        showStatus(
                            'Nouzový offline zápis je připravený.',
                            true,
                            true
                        );
                    }

                    if (message.type === 'OFFLINE_CACHE_PARTIAL') {
                        showStatus(
                            'Většina offline dat je připravená, ale několik stránek se nepodařilo aktualizovat.'
                        );
                    }
                });
            }

            updateConnectionStatus();
        })();
    </script>
</body>
</html>
