<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrace</title>

    {% include '_pwa_head.html' %}
</head>
<body>
    <h1>Registrace</h1>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul style="color: red;">
          {% for message in messages %}
            <li>{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="email">E-mail:</label>
        <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
        ><br><br>

        <label for="password">Heslo:</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            required
        ><br><br>

        <label for="password_confirm">Heslo znovu:</label>
        <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            autocomplete="new-password"
            required
        ><br><br>

        <button type="submit">Registrovat</button>
    </form>

    {% include '_pwa_scripts.html' %}
</body>
</html>
